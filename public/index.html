<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>総合英語 神問題</title>
  <link rel="stylesheet" href="./styles.css?v=20260821-v12">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">総合英語 <span>神問題</span></div>
      <div class="subtitle">単語・熟語・文法・長文を、入試レベルまで一つに。</div>
    </div>
    <div class="top-actions">
      <button id="shuffleBtn" class="ghost-btn">ランダム10問</button>
      <div class="score-pill">正答率 <strong id="accuracy">0%</strong></div>
    </div>
  </header>

  <main class="app-shell">
    <aside class="sidebar">
      <nav id="categoryNav"></nav>
      <div class="side-note">
        <div class="side-note-title">学習状況</div>
        <div class="progress-row"><span>回答数</span><strong id="answeredCount">0</strong></div>
        <div class="progress-row"><span>正解数</span><strong id="correctCount">0</strong></div>
        <div class="progress-actions"><button id="exportProgress" class="ghost-btn small-btn">進捗を書き出す</button><label class="ghost-btn small-btn file-btn">進捗を読み込む<input id="importProgress" type="file" accept="application/json" hidden></label><button id="resetProgress" class="danger-btn">進捗をリセット</button></div>
      </div>
    </aside>

    <section class="content">
      <div class="hero" id="hero">
        <div>
          <div class="eyebrow">ENGLISH MASTER</div>
          <h1 id="pageTitle">単語</h1>
          <p id="pageDescription">重要語をレベル別に確認。まずは意味を答えるところから始めます。</p>
        </div>
        <div class="level-tabs" id="levelTabs"></div>
      </div>

      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="英単語・日本語・タグで検索">
        <select id="vocabModeSelect" aria-label="単語の問題形式"></select>
        <select id="modeSelect" aria-label="出題範囲">
          <option value="all">すべて</option>
          <option value="unanswered">未回答</option>
          <option value="weak">苦手だけ</option>
        </select>
        <button id="startBtn" class="primary-btn">問題を始める</button>
      </div>

      <div id="quizSettings" class="quiz-settings hidden">
        <div class="settings-title">4択クイズ設定</div>
        <label>問題数 <input id="quizCountInput" type="number" min="1" max="200" value="10"></label>
        <div class="settings-group"><span>難易度（複数選択可）</span><div id="quizDifficultyChips" class="level-tabs small">
          <button type="button" class="level-btn active" data-level="basic">基礎</button>
          <button type="button" class="level-btn active" data-level="standard">標準</button>
          <button type="button" class="level-btn active" data-level="developed">発展</button>
          <button type="button" class="level-btn active" data-level="advanced">上級</button>
          <button type="button" class="level-btn active" data-level="hard">難関</button>
        </div></div>
        <button id="startCustomQuizBtn" class="primary-btn">この設定で4択クイズ開始</button>
      </div>

      <div id="questionArea" class="question-card hidden"></div>
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">英</div>
        <h2>学習モードを選んでください</h2>
        <p>左から分野を選択し、「問題を始める」でスタート。</p>
      </div>

      <div class="data-footer">
        <span id="datasetInfo">データを読み込み中…</span>
      </div>
    </section>
  </main>

  <script type="module" src="./app.js?v=20260821-v12"></script>
</body>
</html>
