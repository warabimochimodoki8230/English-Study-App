<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>総合英語 問題</title>
  <link rel="stylesheet" href="./styles.css?v=20260821-v22">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">総合英語 <span>問題</span></div>
      <div class="subtitle">単語・熟語・文法・長文を</div>
    </div>
    <div class="top-actions">
      <div class="score-pill">正答率 <strong id="accuracy">0%</strong></div>
      <button id="resetProgressMobile" class="ghost-btn mobile-reset-btn" type="button">進捗をリセット</button>
    </div>
  </header>

  <main class="app-shell">
    <aside class="sidebar">
      <nav id="categoryNav"></nav>
      <div class="side-note">
        <div class="side-note-title">学習状況</div>
        <div class="progress-row"><span>回答数</span><strong id="answeredCount">0</strong></div>
        <div class="progress-row"><span>正解数</span><strong id="correctCount">0</strong></div>
        <div class="progress-row"><span>正答率</span><strong id="statusAccuracy">0%</strong></div>
        <div class="progress-row"><span>学習済み</span><strong id="masteredCount">0</strong></div>
        <div class="analytics-mini" id="analyticsMini"><div class="analytics-title">分析中…</div></div>
        <div class="genre-mini" id="genreMini"></div><div class="progress-actions"><button id="exportProgress" class="ghost-btn small-btn">進捗を書き出す</button><label class="ghost-btn small-btn file-btn">進捗を読み込む<input id="importProgress" type="file" accept="application/json" hidden></label><button id="resetProgress" class="danger-btn">進捗をリセット</button></div>
      </div>
    </aside>

    <section class="content">
      <div class="hero" id="hero">
        <div>
          <div class="eyebrow">ENGLISH MASTER</div>
          <h1 id="pageTitle">単語</h1>
          <p id="pageDescription">重要語をレベル別に確認。まずは意味を答えるところから始めます。</p>
        </div>
        <div class="level-tabs" id="levelTabs"></div>
      </div>

      <div id="studyControls">
        <div class="toolbar">
          <input id="searchInput" type="search" placeholder="英単語・日本語・問題文で検索">
          <select id="vocabModeSelect" aria-label="単語の問題形式"></select>
          <select id="modeSelect" aria-label="出題範囲">
            <option value="all">すべて</option>
            <option value="unanswered">未回答</option>
            <option value="weak">苦手だけ</option>
          </select>
          <select id="sessionModeSelect" aria-label="学習形式"></select>
          <select id="quizCountPreset" aria-label="問題数">
            <option value="10">10問</option>
            <option value="20">20問</option>
            <option value="50">50問</option>
            <option value="100">100問</option>
            <option value="all">全部</option>
            <option value="custom">指定</option>
          </select>
          <input id="quizCountInput" class="count-custom" type="number" min="1" max="500" value="10" aria-label="問題数を指定">
          <button id="startBtn" class="primary-btn">この設定で開始</button>
        </div>
      </div>

      <div id="questionArea" class="question-card hidden"></div>
      <section id="learningAnalytics" class="analytics-card hidden"></section>
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">英</div>
        <h2>学習モードを選んでください</h2>
        <p>左から分野を選択し、「問題を始める」でスタート。</p>
      </div>

      <div class="data-footer">
        <span id="datasetInfo">データを読み込み中…</span>
      </div>
    </section>
  </main>

  <script type="module" src="./app.js?v=20260821-v22"></script>
</body>
</html>
